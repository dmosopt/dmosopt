[project]
name = "dmosopt"
version = "0.9.3"
description = "Distributed multi-objective surrogate optimization algorithm."
authors = [
    { name = "Ivan Raikov", email = "ivan.g.raikov@gmail.com" }
]
dependencies = [
    "mpi4py>=4.0.0",
    "h5py>=3.11.0",
    "scikit-learn>=1.5.1",
    "distwq>=1.3.4,<2",
    "scipy>=1.13.1",
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
# Main functions
dmosopt-analyze = "dmosopt.dmosopt_analyze:main"
dmosopt-train = "dmosopt.dmosopt_train:main"
dmosopt-onestep = "dmosopt.dmosopt_onestep:main"

[project.optional-dependencies]
extras = [
    "gpytorch>=1.12",
    "salib>=1.5.1",
    "gpflow>=2.9.2,<2.10",
    "moocore>=0.3.0",
]
transformer = [
    # Keras 3 multi-backend deep learning framework (model_transformer.py)
    "keras>=3.0",
    # Default backend; can be substituted with "torch" or "jax[cuda]"
    # by setting KERAS_BACKEND or ~/.keras/keras.json accordingly.
    "tensorflow>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# gpflow 2.9 requires the discontinued tensorflow-macos on Apple Silicon,
# which stops at 2.16 and caps numpy below 2.  Drop that requirement (the
# marker can never match under requires-python) so that macOS uses the
# regular tensorflow wheels pulled in by tensorflow-probability[tf].
override-dependencies = [
    "tensorflow>=2.16",
    "tensorflow-macos; python_version < '3.11'",
]
# tensorflow 2.21 has no Intel macOS wheels, so the lock settles on 2.20;
# keep tf-keras on the matching minor version.
constraint-dependencies = [
    "tf-keras<2.21",
]
dev-dependencies = [
    "pre-commit>=4.1.0",
    "ruff==0.9.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dmosopt"]
